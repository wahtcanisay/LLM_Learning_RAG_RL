stage: stage_b
data_path: MedSearch/data/stage_b/search100_training.json
eval_data_path: MedSearch/data/processed/sft_stage_a/stage_a_dev.jsonl
eval_stage: stage_a
model_path: models/Qwen2.5-3B-Instruct
dtype: bfloat16
use_qlora: true
resume_from_checkpoint: null
adapter_path: MedSearch/outputs/stage_a/adapter
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
max_length: 4096
batch_size: 2
shuffle: false
num_workers: 0

# First formal Search100 run. Keep it separate from the one-step smoke output.
training:
  output_dir: MedSearch/outputs/stage_b/formal
  learning_rate: 0.0002
  num_train_epochs: 1
  max_steps: -1
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  logging_steps: 1
  eval_strategy: epoch
  per_device_eval_batch_size: 1
  prediction_loss_only: true
  report_to: wandb
  run_name: medsearch-stage-b-search100-seed20260831
  seed: 20260831
  optim: adamw_torch
  save_strategy: epoch
  save_total_limit: 1
