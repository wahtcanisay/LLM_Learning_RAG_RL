# 1000 条冻结教师轨迹，CE + 0.1 * Top-32；本轮不加载 dev。
stage: search_distill
data_path: MedSearch/data/distillation/top32_sft1000_20261011/train.parquet
model_path: models/Qwen2.5-3B-Instruct
max_length: 4096
batch_size: 1
shuffle: true
num_workers: 0
dtype: bfloat16
use_qlora: false
adapter_path: null
resume_from_checkpoint: null
eval_data_path: null
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
lora_target_modules: [q_proj, v_proj]
training:
  output_dir: MedSearch/outputs/distillation/sft_top32_epoch1_20261013
  run_name: qwen25-3b-search-distill-top32-epoch1-s20261013
  num_train_epochs: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  lr_scheduler_type: cosine
  warmup_steps: 7
  optim: adamw_torch
  weight_decay: 0.0
  max_grad_norm: 1.0
  gradient_checkpointing: true
  seed: 20261013
  logging_steps: 5
  logging_first_step: true
  disable_tqdm: true
  eval_strategy: "no"
  save_strategy: epoch
  save_total_limit: 2
  save_only_model: false
  report_to: wandb
